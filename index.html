function secToTime(s){if(!s)return"—";const m=Math.floor(s/60),sec=Math.round(s%60);return m+":"+String(sec).padStart(2,"0")}

const rt=p.r.map(x=>`<div class="ri">${x}</div>`).join("");
let dl="";if(p.g5)dl+=`<a href="${p.g5}" download class="dlb">⬇️ GPX 5 км</a>`;if(p.g10)dl+=`<a href="${p.g10}" download class="dlb g10">⬇️ GPX 10 км</a>`;
html+=`<div class="card" data-id="${p.id}"><div class="ch"><div class="ptg"><h2>${p.n}</h2><span class="pl">${p.l}</span></div><label class="cw"><span>ГОТОВО</span><input type="checkbox" class="cb1"></label></div><div class="br">${bhtml}</div><div class="cb"><div class="ic">${inf}</div><div class="rc"><h4>Маршруты</h4>${rt}</div><div class="dl">${dl}</div></div><div class="runs"><h4>Мои забеги</h4><div class="run-list"></div><button class="add-run">+ Добавить забег</button><div class="run-form"><label>Дистанция<select class="f-dist"><option value="5">5 км</option><option value="10">10 км</option><option value="other">Своя (км)</option></select></label><label class="f-other-label" style="display:none">Сколько км?<input type="number" class="f-other" placeholder="15" step="0.1"></label><label>Дата<input type="date" class="f-date"></label><label>Время (мм:сс)<input type="text" class="f-time" placeholder="54:30"></label><label>Заметка<input type="text" class="f-note" placeholder="Ясно, +12"></label><div class="form-btns"><button class="cancel">Отмена</button><button class="save">Сохранить</button></div></div></div></div>`});el.innerHTML=html}
function renderRuns(card){const id=card.dataset.id,list=card.querySelector(".run-list"),runs=getPark(id).runs||[];if(!runs.length){list.innerHTML='<div class="empty">Пока нет записей</div>';return}
list.innerHTML=runs.map((r,i)=>{const cls=r.dist==="5"?"d5":(r.dist==="10"?"d10":"dx");const d=diffPace(r);const pace=paceOf(r);const paceHtml=pace?`<span style="color:var(--m)">${secToTime(pace)}/км</span>`:"";return `<div class="run-item"><div class="run-top"><div class="run-line"><span class="dist ${cls}">${r.dist} км</span>${r.date||"—"} · ${r.time||"—"} ${paceHtml} ${d?`<span class="diff ${d.plus?'plus':'minus'}">${d.text}</span>`:""}</div><button class="rm" data-i="${i}">✕</button></div>${r.note?`<div class="note">${r.note}</div>`:""}</div>`}).join("");
list.querySelectorAll(".rm").forEach(b=>{b.onclick=()=>{const a=getPark(id).runs;a.splice(+b.dataset.i,1);scheduleSave();renderRuns(card);updateStats()}})}
function totalKm(){let s=0;P.forEach(p=>{(getPark(p.id).runs||[]).forEach(r=>{s+=parseFloat(r.dist)||0})});return s}
function totalRuns(){let c=0;P.forEach(p=>{c+=(getPark(p.id).runs||[]).length});return c}
function avgPace(){let sec=0,km=0;P.forEach(p=>{(getPark(p.id).runs||[]).forEach(r=>{const t=timeToSec(r.time),d=parseFloat(r.dist);if(t&&d){sec+=t;km+=d}})});return km?sec/km:null}
function bestTime(dist){let best=null;P.forEach(p=>{(getPark(p.id).runs||[]).forEach(r=>{if(parseFloat(r.dist)===dist){const t=timeToSec(r.time);if(t&&(!best||t<best))best=t}})});return best}
function updateStats(){const km=totalKm(),runs=totalRuns(),ap=avgPace(),b5=bestTime(5),b10=bestTime(10);document.getElementById("stats").innerHTML=`<div class="stat"><span class="sv">${km.toFixed(1)}</span><span class="sl">км пробежано</span></div><div class="stat"><span class="sv">${runs}</span><span class="sl">забегов</span></div><div class="stat"><span class="sv">${ap?secToTime(ap):"—"}</span><span class="sl">средний темп</span></div><div class="stat"><span class="sv">${b5?secToTime(b5):"—"} / ${b10?secToTime(b10):"—"}</span><span class="sl">рекорд 5/10</span></div>`;
const done=P.filter(p=>getPark(p.id).done).length;
const achievements=[{i:"🥇",n:"1 парк",ok:done>=1},{i:"🏃",n:"5 парков",ok:done>=5},{i:"🏅",n:"10 парков",ok:done>=10},{i:"🏆",n:"Все 16",ok:done>=16},{i:"🔥",n:"50 км",ok:km>=50},{i:"💯",n:"100 км",ok:km>=100},{i:"⚡",n:"Десятка",ok:!!b10}];
document.getElementById("ach").innerHTML=achievements.map(a=>`<div class="achitem ${a.ok?'on':''}">${a.i} ${a.n}</div>`).join("");
document.getElementById("pb").style.width=(done/P.length*100)+"%";document.getElementById("pt").innerText=`Пройдено ${done} из ${P.length}`}
function applyFilter(){document.querySelectorAll(".card").forEach(card=>{const id=card.dataset.id,done=!!getPark(id).done;let show=true;if(UI.filter==="done"&&!done)show=false;if(UI.filter==="notdone"&&done)show=false;card.style.display=show?"":"none"})}
function bindCards(){document.querySelectorAll(".card").forEach(card=>{const id=card.dataset.id,cb=card.querySelector(".cb1"),form=card.querySelector(".run-form"),addBtn=card.querySelector(".add-run"),sel=card.querySelector(".f-dist"),ol=card.querySelector(".f-other-label"),oi=card.querySelector(".f-other"),di=card.querySelector(".f-date"),ti=card.querySelector(".f-time"),ni=card.querySelector(".f-note");cb.checked=!!getPark(id).done;cb.onchange=()=>{getPark(id).done=cb.checked;scheduleSave();updateStats();applyFilter()};renderRuns(card);addBtn.onclick=()=>{form.classList.add("open");addBtn.style.display="none";if(!di.value)di.value=new Date().toISOString().slice(0,10)};sel.onchange=()=>{ol.style.display=sel.value==="other"?"flex":"none"};function closeForm(){form.classList.remove("open");addBtn.style.display="block";oi.value="";ti.value="";ni.value="";sel.value="5";ol.style.display="none"}form.querySelector(".cancel").onclick=closeForm;
form.querySelector(".save").onclick=()=>{let d=sel.value;if(d==="other"){d=oi.value.trim();if(!d){alert("Укажите дистанцию");return}}const t=ti.value.trim();if(!t){alert("Укажите время");return}const park=getPark(id);if(!park.runs)park.runs=[];park.runs.push({dist:d,date:di.value,time:t,note:ni.value.trim()});park.done=true;scheduleSave();renderRuns(card);cb.checked=true;updateStats();applyFilter();closeForm()}})}
function renderAll(){buildHTML();bindCards();updateStats();applyFilter()}
function exportCSV(){let csv="Парк;Район;Дистанция;Дата;Время;Темп;Заметка\n";P.forEach(p=>{(getPark(p.id).runs||[]).forEach(r=>{const pace=paceOf(r);csv+=`${p.n};${p.l};${r.dist};${r.date||""};${r.time||""};${pace?secToTime(pace)+"/км":""};${(r.note||"").replace(/[;\n]/g,",")}\n`})});const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="runs.csv";a.click()}
function copyProgress(){const done=P.filter(p=>getPark(p.id).done).length;const km=totalKm(),runs=totalRuns();const text=`🏃‍♂️ Мой беговой челлендж СПб:\n✅ Парков: ${done}/${P.length}\n🏃 Забегов: ${runs}\n📏 Пробежано: ${km.toFixed(1)} км`;navigator.clipboard.writeText(text).then(()=>alert("Скопировано!")).catch(()=>alert(text))}
function applyTheme(){document.body.classList.toggle("light",UI.theme==="light");localStorage.setItem("ui_theme",UI.theme)}
function applyCompact(){document.body.classList.toggle("compact",UI.compact);localStorage.setItem("ui_compact",UI.compact?"1":"0")}
document.getElementById("themeBtn").onclick=()=>{UI.theme=UI.theme==="light"?"dark":"light";applyTheme()};
document.getElementById("compactBtn").onclick=()=>{UI.compact=!UI.compact;applyCompact()};
document.getElementById("filterSel").value=UI.filter;
document.getElementById("sortSel").value=UI.sort;
document.getElementById("filterSel").onchange=e=>{UI.filter=e.target.value;localStorage.setItem("ui_filter",UI.filter);applyFilter()};
document.getElementById("sortSel").onchange=e=>{UI.sort=e.target.value;localStorage.setItem("ui_sort",UI.sort);renderAll()};
document.getElementById("csvBtn").onclick=exportCSV;
document.getElementById("copyBtn").onclick=copyProgress;
document.getElementById("rb").onclick=()=>{if(confirm("Сбросить весь прогресс?")){DATA={parks:{}};saveData().then(()=>location.reload())}};
applyTheme();applyCompact();loadData();
</script>
</body>
</html>
