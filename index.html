.box{background:var(--card);border:1px solid var(--br);border-radius:10px;padding:12px;margin:10px 0}
.bx-title{font-size:11px;color:var(--b);font-weight:bold;margin-bottom:8px}
.goal-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}

.goal-progress{background:var(--br);border-radius:6px;height:12px;overflow:hidden;margin-bottom:4px}

.goal-text{font-size:10px;color:var(--m);text-align:center}

.box{background:var(--card);border:1px solid var(--br);border-radius:10px;padding:12px;margin:10px 0}

.heatmap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}

.pw{margin:10px 0;text-align:center}
.pc{background:var(--br);border-radius:10px;height:12px;overflow:hidden;margin-bottom:5px}
.pb{background:var(--g);height:100%;width:0;transition:width .3s}
.pt{font-size:11px;color:var(--g);font-weight:bold}

.st{font-size:15px;color:var(--b);border-left:4px solid var(--b);padding-left:10px;margin:22px 0 10px;text-transform:uppercase}

.ptg h2{font-size:14px;margin:0 0 2px}
.pl{font-size:9px;display:inline-block;color:var(--o);font-weight:600;text-transform:uppercase}
.cw{display:flex;align-items:center;gap:5px;font-weight:bold;color:var(--g);font-size:10px;cursor:pointer}
.cw input{width:18px;height:18px;accent-color:var(--g)}
.br{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.bd{background:var(--bd);color:var(--t);padding:2px 6px;border-radius:4px;font-size:9px;font-weight:600}

.cb{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:10.5px}
.ic p{margin:0 0 5px;color:var(--m)}.ic p strong{color:var(--t)}
.rc{background:rgba(0,0,0,.1);border-radius:6px;padding:8px;border:1px solid var(--br)}
.rc h4{margin:0 0 5px;color:var(--g);font-size:10px;text-transform:uppercase}
.ri{margin-bottom:4px;font-size:10px}.ri:last-child{margin-bottom:0}
.dl{margin-top:10px;grid-column:span 2;display:flex;flex-wrap:wrap;gap:8px}

.dlb.g10{background:linear-gradient(135deg,#ff6b35,#cc4400);color:#fff}
.runs{margin-top:10px;border-top:1px solid var(--br);padding-top:10px}

.run-item{background:var(--bd);border-radius:6px;padding:6px 8px;font-size:10px}
.run-top{display:flex;justify-content:space-between;align-items:center}
.run-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px}

.note{color:var(--m);font-size:9px;margin-top:3px;font-style:italic}

  .heatmap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.hm-cell{aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;background:var(--bd);color:var(--m);position:relative}

];function locIcon(loc){const l=(loc||"").toLowerCase();if(l.includes("петроград"))return "🌉";if(l.includes("крестов"))return "🏟️";if(l.includes("центральн"))return "🏛️";if(l.includes("адмиралтей"))return "⚓";if(l.includes("выборг"))return "🌲";if(l.includes("приморск"))return "🌊";if(l.includes("московск"))return "🏙️";if(l.includes("купчино"))return "🌳";if(l.includes("петергоф"))return "⛲";if(l.includes("пушкин"))return "👑";if(l.includes("павловск"))return "🍂";if(l.includes("гатчин"))return "🏰";if(l.includes("токсов")||l.includes("лемболов"))return "🏕️";return "📍"}function timeToSec(t){if(!t)return 0;const p=t.replace(",",".").split(":");if(p.length===2)return(+p[0])*60+(+p[1]);if(p.length===3)return(+p[0])*3600+(+p[1])*60+(+p[2]);return+p[0]||0}

const runDays={};P.forEach(p=>(getPark(p.id).runs||[]).forEach(r=>{if(!r.date)return;const[y,m,d]=r.date.split("-").map(Number);if(y===year&&m===month+1)runDays[d]=(runDays[d]||0)+1}));

  function allRunDates(){
  const dates=[];
  P.forEach(p=>(getPark(p.id).runs||[]).forEach(r=>{if(r.date)dates.push(r.date)}));

}
function weekKey(d){
  const dt=new Date(d);
  const dow=(dt.getDay()+6)%7;
  dt.setDate(dt.getDate()-dow);
  return dt.toISOString().slice(0,10);
}
function renderStreak(){
  const dates=allRunDates().map(d=>weekKey(d));
  const uniq=[...new Set(dates)].sort();
  if(!uniq.length){document.getElementById("streakNum").textContent="0";return}
  const now=new Date();
  const thisWeek=weekKey(now.toISOString().slice(0,10));
  let streak=0;
  let cur=thisWeek;
  if(!uniq.includes(cur)){
    const prev=new Date();prev.setDate(prev.getDate()-7);
    cur=weekKey(prev.toISOString().slice(0,10));
  }
  while(uniq.includes(cur)){
    streak++;
    const prev=new Date(cur);prev.setDate(prev.getDate()-7);
    cur=weekKey(prev.toISOString().slice(0,10));
  }
  document.getElementById("streakNum").textContent=streak;
}
function renderHeatmap(){
  const box=document.getElementById("heatmap");
  if(!box)return;
  box.innerHTML=P.map(p=>{
    const runs=getPark(p.id).runs||[];
    const n=runs.length;
    const done=getPark(p.id).done;
    let lvl=0;
    if(n>=1)lvl=1;
    if(n>=3)lvl=2;
    if(n>=6)lvl=3;
    if(n>=10)lvl=4;
    return `<div class="hm-cell l${lvl} ${done?'done':''}" data-id="${p.id}" title="${p.n}: ${n} забегов">${p.id}</div>`;
  }).join("");
  box.querySelectorAll(".hm-cell").forEach(c=>{
    c.onclick=()=>{
      const card=document.querySelector(`.card[data-id="${c.dataset.id}"]`);
      if(card){
        card.scrollIntoView({behavior:"smooth",block:"start"});
        card.style.transition="outline .3s";
        card.style.outline="2px solid var(--o)";
        setTimeout(()=>card.style.outline="",1800);
      }
    };
  });
}

function applyTheme(){document.body.classList.toggle("light",UI.theme==="light");localStorage.setItem("ui_theme",UI.theme)}
function applyCompact(){document.body.classList.toggle("compact",UI.compact);localStorage.setItem("ui_compact",UI.compact?"1":"0")}
document.getElementById("themeBtn").onclick=()=>{UI.theme=UI.theme==="light"?"dark":"light";applyTheme()};
document.getElementById("compactBtn").onclick=()=>{UI.compact=!UI.compact;applyCompact()};
document.getElementById("goalInput").addEventListener("change",e=>{const v=parseFloat(e.target.value);if(v>0){DATA.goalKm=v;scheduleSave();updateGoal()}});document.getElementById("randomBtn").onclick=()=>{
  const undone=P.filter(p=>!getPark(p.id).done);
  const pool=undone.length?undone:P;
  const pick=pool[Math.floor(Math.random()*pool.length)];
  const card=document.querySelector(`.card[data-id="${pick.id}"]`);
  if(card){
    card.scrollIntoView({behavior:"smooth",block:"start"});
    card.style.transition="outline .3s";
    card.style.outline="2px solid var(--g)";
    setTimeout(()=>card.style.outline="",2000);
  }
};
document.getElementById("filterSel").value=UI.filter;
document.getElementById("sortSel").value=UI.sort;
document.getElementById("filterSel").onchange=e=>{UI.filter=e.target.value;localStorage.setItem("ui_filter",UI.filter);applyFilter()};
document.getElementById("sortSel").onchange=e=>{UI.sort=e.target.value;localStorage.setItem("ui_sort",UI.sort);renderAll()};
document.getElementById("csvBtn").onclick=exportCSV;document.getElementById("jsonBtn").onclick=exportJSON;
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0])};
document.getElementById("copyBtn").onclick=copyProgress;
document.getElementById("rb").onclick=()=>{if(confirm("Сбросить весь прогресс?")){DATA={parks:{},goalKm:DATA.goalKm||500};saveData().then(()=>location.reload())}};
function renderAll(){buildHTML();bindCards();updateStats();applyFilter();renderChart();renderCalendar();renderHeatmap()}applyTheme();applyCompact();loadData();
</script>
</body>
</html>
